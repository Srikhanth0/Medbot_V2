[project]
name = "medbot-backend"
version = "0.1.0"
description = "MedBot — Medical Understanding Platform RAG Backend"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.12",

    # LLM & RAG orchestration
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "openai>=1.50.0",

    # Database
    "supabase>=2.10.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",

    # PDF Parsing
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",

    # Auth
    "PyJWT[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",

    # Observability
    "langfuse>=2.50.0",
    "sentry-sdk[fastapi]>=2.15.0",

    # Utils
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
